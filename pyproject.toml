[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "treening"
version = "0.1.0"
description = "A tree that grows knowledge - textbook-learning as a standalone local app"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
docx = ["python-docx>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
treening = "treening.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["treening", "treening.services", "treening.blueprints"]

[tool.setuptools.package-data]
treening = ["templates/*.html", "static/**/*"]
