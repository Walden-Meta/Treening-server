[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "textree"
version = "0.1.0"
description = "A tree that grows knowledge - textbook-learning as a standalone local app"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
docx = ["python-docx>=1.0"]
dev = ["pytest>=7.0"]

[project.scripts]
textree = "textree.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["textree", "textree.services", "textree.blueprints"]

[tool.setuptools.package-data]
textree = ["templates/*.html", "static/**/*"]
