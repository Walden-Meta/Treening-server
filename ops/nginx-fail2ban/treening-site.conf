# treening.cc nginx server 块（含限流 location），安装到 /etc/nginx/sites-enabled/treening
server {
    listen 80;
    server_name treening.cc;
    return 301 https://treening.cc$request_uri;
}

server {
    listen 443 ssl http2;
    server_name treening.cc;

    ssl_certificate     /etc/letsencrypt/live/treening.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/treening.cc/privkey.pem;

    client_max_body_size 20M;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 认证端点（登录/注册/忘记密码）：严格限流防爆破，应用层还有 15min 冷却兜底
    location /api/auth/ {
        limit_req zone=treening_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余 API：宽松限流（240r/m + burst 60），挡扫描器循环，不挡正常学习轮询
    location /api/ {
        limit_req zone=treening_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
