<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treening · 设置新密码</title>
<link rel="icon" type="image/png" href="/static/img/logo.png">
<script src="/static/js/theme.js?v=20260807-08"></script>
<link rel="stylesheet" href="/static/css/tree.css?v=20260807-12">
</head>
<body>
<main class="quiz-shell">
  <section class="access-panel" aria-labelledby="reset-title">
    <button class="theme-toggle theme-toggle-switch setup-theme-toggle" type="button" data-theme-toggle aria-pressed="false">
      <span class="theme-toggle-thumb" aria-hidden="true">
        <svg class="theme-toggle-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.6M12 19.4V22M2 12h2.6M19.4 12H22M4.9 4.9l1.9 1.9M17.2 17.2l1.9 1.9M19.1 4.9l-1.9 1.9M6.8 17.2l-1.9 1.9"/></svg>
        <svg class="theme-toggle-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </span>
    </button>
    <span class="eyebrow">TREENING / NEW PASSWORD</span>
    <h1 id="reset-title">设置新密码</h1>
    <p>通过邮件链接进入，可重新设置你的登录密码。</p>
    <form id="reset-form">
      <label for="reset-password">新密码（8-64 位）</label>
      <input id="reset-password" type="password" minlength="8" maxlength="64" autocomplete="new-password" required>
      <label for="reset-password2">确认新密码</label>
      <input id="reset-password2" type="password" autocomplete="new-password" required>
      <p class="form-error" id="reset-error" role="alert"></p>
      <div class="access-row">
        <button class="button button-primary" type="submit">重置密码</button>
      </div>
    </form>
    <div id="reset-success" hidden style="font-size:13px;line-height:1.7">
      <p style="margin:0 0 12px">✓ 密码已重置。</p>
      <a class="button button-primary" href="/login">去登录</a>
    </div>
    <p style="margin-top:16px;font-size:13px">
      返回 <a class="text-button" href="/login">登录页</a>
    </p>
  </section>
</main>
<script src="/static/js/reset.js?v=20260807-1"></script>
</body>
</html>
