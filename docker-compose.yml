services:
  textree:
    build: .
    container_name: textree
    restart: unless-stopped
    ports:
      - "${TEXTREE_HOST_PORT:-5001}:5000"
    environment:
      # 模型（OpenAI 兼容；不填则首次访问走设置向导）
      TEXTREE_API_KEY: ${TEXTREE_API_KEY:-}
      TEXTREE_API_URL: ${TEXTREE_API_URL:-https://api.deepseek.com/chat/completions}
      TEXTREE_MODEL: ${TEXTREE_MODEL:-deepseek-chat}
    volumes:
      - ./docker-data/textree:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
